repos:
      - repo: https://github.com/DavidAnson/markdownlint-cli2
        rev: v0.22.1
        hooks:
              - id: markdownlint-cli2
                args: ["--fix"]

      - repo: local
        hooks:
              - id: ruff-check
                name: ruff check src/ tests/
                entry: ruff check src/ tests/ --fix --exit-non-zero-on-fix
                language: system
                pass_filenames: false
                always_run: true
                types: [python]

              - id: mypy-check
                name: mypy src/
                entry: mypy src/ --ignore-missing-imports
                language: system
                pass_filenames: false
                always_run: true
                types: [python]

              - id: pytest-check
                name: pytest tests/
                entry: .venv/bin/python -m pytest tests/ -v --tb=short
                language: system
                pass_filenames: false
                always_run: true
                types: [python]

              - id: mkdocs-build
                name: mkdocs build --strict
                entry: mkdocs build --strict
                language: system
                pass_filenames: false
                always_run: true
                files: "(docs/|mkdocs\\.yml)"
