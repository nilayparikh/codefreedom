[changelog]
header = """
# Changelog\n
All notable changes to CodeFreedom will be documented here.\n
Format based on [Keep a Changelog](https://keepachangelog.com/) and
[Conventional Commits](https://www.conventionalcommits.org/).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}\
{% else %}\
    ## [Unreleased]\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first | trim }}\
            {% if commit.links %} ({{ commit.links | join(sep=", ") }}){% endif %}\
    {% endfor %}\
{% endfor %}\n
"""
footer = """
---
*Generated by [git-cliff](https://git-cliff.org/)*
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^doc", group = "Documentation" },
    { message = "^ci", group = "CI/CD" },
    { message = "^chore.releases.", group = "Release" },
    { message = "^chore.deps.", group = "Dependencies", skip = true },
    { message = "^chore.pr.", skip = true },
    { message = "^chore.pull.", skip = true },
    { message = "^chore.npm", skip = true },
    { message = "^style", skip = true },
    { message = "^test", group = "Testing" },
    { body = ".*security", group = "Security" },
    { message = "^revert", group = "Reverted" },
]
protect_breaking_commits = false
filter_changelog = false
date_order = true
sort_commits = "oldest"
