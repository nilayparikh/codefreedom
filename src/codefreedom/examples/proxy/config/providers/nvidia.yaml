---
# ── NVIDIA AI Endpoints Provider ──────────────────────────────────────────────
# Routes to NVIDIA's API catalog (nvidia.com).
# Set NVIDIA_API_KEY to enable.
#
# DISCLAIMER:
#   - This config is provided AS-IS with no warranty of any kind.
#   - Example/template only — uncomment and adapt to your environment.
#   - Validate pricing, rate limits, and model capabilities with your
#     provider before relying on them in production.
#   - Model specs (context window, max tokens, vision support) and costs
#     change over time — verify against current provider documentation.
#   - Leaving API keys empty disables a provider — nothing phones home.
#
# ── WHY 1-2 EXAMPLES ─────────────────────────────────────────────────────────
# This file ships with ONE active model and ONE commented example. NVIDIA's
# catalog changes often — new models arrive, others deprecate. Maintaining a
# long list guarantees stale entries. A minimal active + one pattern example
# is easier to keep correct. Uncomment + adapt for additional models.
# ──────────────────────────────────────────────────────────────────────────────

model_list:
  # ── ACTIVE MODEL ──────────────────────────────────────────────────────────
  # Set NVIDIA_API_KEY and NVIDIA_BASE_URL in .env.proxy.secrets.
  # Works immediately after proxy restart.
  - model_name: NVIDIA/DeepSeek-V4-Flash
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4-flash
      api_base: os.environ/NVIDIA_BASE_URL
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 300
      drop_params: true
      extra_body:
        stream_options:
          include_usage: true
    model_info:
      id: "nvidia-deepseek-v4-flash"
      db_model: false
      supports_reasoning: true
      mode: chat
      context_window: 1000000
      max_tokens: 1000000
      max_input_tokens: 616000
      max_output_tokens: 384000
      limit:
        context: 1000000
        output: 384000
      supports_system_messages: true
      supports_native_streaming: true
      supports_vision: false
      supported_openai_params: &nvidia_supported_openai_params
        - tools
        - tool_choice
        - parallel_tool_calls
        - response_format
        - max_tokens
        - max_completion_tokens
        - stream
        - stream_options
        - temperature
        - top_p
        - stop
        - thinking
        - reasoning_effort

  # ── EXAMPLE: Model with different extra_body ──────────────────────────────
  # Kimi-K2.6 uses chat_template_kwargs instead of plain stream_options.
  # Uncomment, change model_name/model, and adjust context/costs.
  #
  # - model_name: NVIDIA/Kimi-K2.6
  #   litellm_params:
  #     model: openai/moonshotai/kimi-k2.6
  #     api_base: os.environ/NVIDIA_BASE_URL
  #     api_key: os.environ/NVIDIA_API_KEY
  #     timeout: 300
  #     drop_params: true
  #     extra_body:
  #       chat_template_kwargs:
  #         thinking: true
  #       stream_options:
  #         include_usage: true
  #   model_info:
  #     id: "nvidia-openai-kimi-k2-6"
  #     db_model: false
  #     supports_reasoning: true
  #     mode: chat
  #     context_window: 256000
  #     max_tokens: 256000
  #     max_input_tokens: 256000
  #     max_output_tokens: 16384
  #     limit:
  #       context: 256000
  #       output: 16384
  #     supports_system_messages: true
  #     supports_native_streaming: true
  #     supports_vision: true
  #     supported_openai_params: *nvidia_supported_openai_params
