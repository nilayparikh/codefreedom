---
# ── Local Provider ───────────────────────────────────────────────────────────
# Generic local backend — routes to any OpenAI-compatible
# inference server running on the host machine.
#
# The model, api_base, and api_key all come from environment variables
# injected by docker-compose (LOCAL_M_* / LOCAL_S_*).
# Set LOCAL_M_API_KEY / LOCAL_S_API_KEY to enable each backend.
#
# ── ALL MODELS ARE COMMENTED ─────────────────────────────────────────────────
# Every model entry in this file is commented out. This keeps the example
# minimal, readable, and free of stale specs. To enable a model:
#
# Field-by-field explanations: see ../understanding-litellm.md
#
#   1. Set LOCAL_M_API_KEY (and LOCAL_M_BASE_URL if different from default)
#      in .env.proxy.secrets.
#   2. Uncomment the model block you want (remove "# " before each line).
#   3. Restart the proxy:
#      codefreedom proxy restart
#
# Local inference stacks change fast (new engines, updated model names).
# A long list of every available model would be outdated within weeks.
# One commented example and one variation show the pattern — adapt from here.
# ──────────────────────────────────────────────────────────────────────────────

