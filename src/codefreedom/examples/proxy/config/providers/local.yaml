---
# ── Local Provider ───────────────────────────────────────────────────────────
# Generic local backend — routes to any OpenAI-compatible
# inference server running on the host machine.
#
# The model, api_base, and api_key all come from environment variables
# injected by docker-compose (LOCAL_M_* / LOCAL_S_*).
# Set LOCAL_M_API_KEY / LOCAL_S_API_KEY to enable each backend.
#
# ── WHY 1-2 EXAMPLES ─────────────────────────────────────────────────────────
# This file ships with ONE active model and ONE commented example. Local
# inference stacks change fast (new engines, updated model names). Keeping
# the active set minimal means less drift between config and reality.
# Uncomment the second model when you deploy a second endpoint.
# ──────────────────────────────────────────────────────────────────────────────

model_list:
  # ── ACTIVE MODEL ──────────────────────────────────────────────────────────
  # Primary coding/reasoning model on port 8000. Map this as CodeFreedom/Pro
  # by setting LITELLM_MODEL_ALIAS_PRO="DGX/Qwen3.6-27B" in .env.proxy.
  - model_name: DGX/Qwen3.6-27B
    litellm_params:
      model: openai/qwen3.6_27b
      api_base: os.environ/LOCAL_M_BASE_URL
      api_key: os.environ/LOCAL_M_API_KEY
      timeout: 300
      include_reasoning: true
      max_tokens: 131072
      max_completion_tokens: 16384
      extra_body:
        seed: 42
        temperature: 0.0
        top_p: 1.0
        top_k: 1
        presence_penalty: 0.0
        repetition_penalty: 1.0
        max_thinking_tokens: 1536
        forward_compatibility: true
        stream_options:
          include_usage: true
        chat_template_kwargs:
          enable_thinking: true
          preserve_thinking: false

    model_info:
      id: "local-qwen3.6-27b"
      db_model: false
      supports_reasoning: true
      mode: chat
      context_window: 131072
      max_tokens: 131072
      max_input_tokens: 114688
      max_output_tokens: 16384
      limit:
        context: 131072
        output: 16384
      supports_system_messages: true
      supports_native_streaming: true
      supports_vision: false
      supported_openai_params:
        - tools
        - tool_choice
        - parallel_tool_calls
        - response_format
        - max_tokens
        - max_completion_tokens
        - stream
        - stream_options
        - temperature
        - top_p
        - stop
        - thinking
        - reasoning_effort

    codefreedom:
      plugins:
        reasoning-efforts:
          rule: local-qwen3-6-27b

  # ── EXAMPLE: Second local model on a different port ───────────────────────
  # Fast, large-context model on port 8001. Map as CodeFreedom/Air:
  #   LITELLM_MODEL_ALIAS_AIR="DGX/Qwen3.6-35B-A3B"
  #
  # Differences from the active model: different api_base, larger context,
  # supports_vision: true.
  #
  # - model_name: DGX/Qwen3.6-35B-A3B
  #   litellm_params:
  #     model: openai/qwen3.6_35b_a3b
