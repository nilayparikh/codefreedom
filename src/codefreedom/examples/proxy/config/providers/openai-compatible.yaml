# ── OpenAI-Compatible Provider ────────────────────────────────────────────────
# Generic OpenAI-compatible endpoint — bring your own model.
#
# Use this for any service that exposes an OpenAI-compatible API:
#   - Self-hosted backends (llama.cpp server, Ollama, vLLM, etc.)
#   - Third-party proxies or gateways
#   - Any endpoint that accepts /v1/chat/completions
#
# ── HOW TO CONFIGURE ───────────────────────────────────────────────────────
# Set these in your .env or .env.secrets:
#
#   OPENAI_COMPAT_BASE_URL=http://localhost:8000/v1
#   OPENAI_COMPAT_API_KEY=sk-your-key
#   OPENAI_COMPAT_MODEL=openai/your-model-name
#
# To add more models, copy the model block below and adjust the name/lite_model.
# ──────────────────────────────────────────────────────────────────────────

