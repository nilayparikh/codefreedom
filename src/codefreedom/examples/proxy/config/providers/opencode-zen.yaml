---
# ── OpenCode Zen Provider — MNP Key ──────────────────────────────────────────
# Free-tier models from OpenCode Zen, routed through the MNP API key.
# Set OPENCODE_ZEN_API_KEY to enable.
#
# DISCLAIMER:
#   - This config is provided AS-IS with no warranty of any kind.
#   - Example/template only — uncomment and adapt to your environment.
#   - Free-tier models may have rate limits, usage caps, or availability
#     restrictions — check with your provider before relying on them.
#   - Model specs (context window, max tokens, vision support) and costs
#     change over time — verify against current provider documentation.
#   - Leaving API keys empty disables a provider — nothing phones home.
#
# ── WHY 1-2 EXAMPLES ─────────────────────────────────────────────────────────
# This file ships with ONE active model and ONE commented example. OpenCode
# Zen's free-tier roster changes frequently — models appear and disappear
# without deprecation notices. A long list guarantees stale entries.
# One active + one pattern example keeps the file both useful and correct.
# ──────────────────────────────────────────────────────────────────────────────

model_list:
  # ── ACTIVE MODEL ──────────────────────────────────────────────────────────
  # Set OPENCODE_ZEN_API_KEY and OPENCODE_ZEN_BASE_URL in .env.proxy.secrets.
  # Works immediately after proxy restart.
  - model_name: OpenCodeZen/MiMo-V2.5-FREE
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: os.environ/OPENCODE_ZEN_BASE_URL
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      timeout: 300
      drop_params: true
      extra_body:
        temperature: 0.0
        top_p: 1.0
        reasoning_effort: "high"
        stream_options:
          include_usage: true

    model_info:
      id: "opencode-mimo-v2.5-free"
      db_model: false
      supports_reasoning: true
      mode: chat
      supports_system_messages: true
      supports_native_streaming: true
      supports_vision: true
      context_window: 1048576
      max_tokens: 1048576
      max_input_tokens: 917504
      max_output_tokens: 131072
      limit:
        context: 1048576
        output: 131072
      supported_openai_params: &opencode_zen_openai_supported_params
        - tools
        - tool_choice
        - parallel_tool_calls
        - max_tokens
        - max_completion_tokens
        - stream
        - stream_options
        - temperature
        - top_p
        - stop
        - thinking
        - reasoning_effort
        - response_format

    codefreedom:
      plugins:
        reasoning-efforts:
          rule: ocz-mimo-v2-5

  # ── EXAMPLE: Different model on the same API ──────────────────────────────
  # Nemotron-3-Ultra — NVIDIA-backed, 1M context, 128K output. Same
  # api_base/key, different model name and specs. Uncomment to enable.
  #
  # - model_name: OpenCodeZen/Nemotron-3-Ultra-FREE
  #   litellm_params:
  #     model: openai/nemotron-3-ultra-free
  #     api_base: os.environ/OPENCODE_ZEN_BASE_URL
  #     api_key: os.environ/OPENCODE_ZEN_API_KEY
  #     timeout: 300
  #     drop_params: true
  #     extra_body:
  #       temperature: 0.0
  #       top_p: 1.0
  #       reasoning_effort: "high"
  #       stream_options:
  #         include_usage: true
