---
# ── DeepSeek Provider ────────────────────────────────────────────────────────
# Native DeepSeek API — V4 Pro (reasoning) and V4 Flash (fast).
#
# ── ALL MODELS ARE COMMENTED ─────────────────────────────────────────────────
# Every model entry in this file is commented out. This keeps the example
# minimal, readable, and free of stale specs. To enable a model:
#
# Field-by-field explanations: see ../understanding-litellm.md
#
#   1. Set DEEPSEEK_API_KEY and DEEPSEEK_BASE_URL in .env.proxy.secrets.
#   2. Uncomment the model block you want (remove "# " before each line).
#   3. Restart the proxy:
#      codefreedom proxy restart
#
# Model specs, pricing, and capabilities change frequently. A long list of
# every available model would be outdated within weeks. Two commented examples
# show the pattern — one active model and one alternate tier. Adapt and add
# from here as needed.
# ──────────────────────────────────────────────────────────────────────────────

# model_list:
#   # ── EXAMPLE: DeepSeek-V4-Flash ────────────────────────────────────────────
#   # Reasoning-capable fast model. Uncomment block below, set env vars, restart.
#   - model_name: DeepSeek/DeepSeek-V4-Flash
