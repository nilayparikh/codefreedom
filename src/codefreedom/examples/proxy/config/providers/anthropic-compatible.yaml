# ── Anthropic-Compatible Provider ─────────────────────────────────────────────
# Generic Anthropic-compatible endpoint — bring your own model.
#
# Use this for any service that exposes an Anthropic-compatible Messages API:
#   - Self-hosted backends with Anthropic API compatibility
#   - Third-party proxies or gateways that speak the Anthropic protocol
#   - Any endpoint that accepts /v1/messages
#
# ── HOW TO CONFIGURE ───────────────────────────────────────────────────────
# Set these in your .env or .env.secrets:
#
#   ANTHROPIC_COMPAT_BASE_URL=http://localhost:8000
#   ANTHROPIC_COMPAT_API_KEY=sk-your-key
#   ANTHROPIC_COMPAT_MODEL=claude-sonnet-4-20250514
#
# To add more models, copy the model block below and adjust the name/lite_model.
