# ── Anthropic-Compatible Provider ─────────────────────────────────────────────
# Generic Anthropic-compatible endpoint — bring your own model.
#
# DISCLAIMER:
#   - This config is provided AS-IS with no warranty of any kind.
#   - Example/template only — uncomment and adapt to your environment.
#   - Validate pricing, rate limits, and model capabilities with your
#     provider before relying on them in production.
#   - Model specs (context window, max tokens, vision support) and costs
#     change over time — verify against current provider documentation.
#   - Leaving API keys empty disables a provider — nothing phones home.
#
# Use this for any service that exposes an Anthropic-compatible Messages API:
#   - Self-hosted backends with Anthropic API compatibility
#   - Third-party proxies or gateways that speak the Anthropic protocol
#   - Any endpoint that accepts /v1/messages
#
# ── WHY THIS IS ALL COMMENTED ────────────────────────────────────────────────
# Unlike the other provider files, this is a BLANK TEMPLATE — there's no
# default API key, no default model name, and no default endpoint. Every
# deployment is different. The example below shows the full structure; copy,
# uncomment, and adapt to your backend. See the README.md in this directory
# for the philosophy used by the other provider files.
#
# Field-by-field explanations: see ../understanding-litellm.md
# ──────────────────────────────────────────────────────────────────────────

