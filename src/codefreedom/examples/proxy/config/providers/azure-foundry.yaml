---
# ── Microsoft Foundry (Azure) Provider ────────────────────────────────────────
# Routes to Azure AI Foundry / Azure OpenAI deployments.
# Set MICROSOFT_FOUNDRY_API_BASE and MICROSOFT_FOUNDRY_API_KEY to enable.
#
# ── ALL MODELS ARE COMMENTED ─────────────────────────────────────────────────
# Every model entry in this file is commented out. This keeps the example
# minimal, readable, and free of stale specs. To enable a model:
#
# Field-by-field explanations: see ../understanding-litellm.md
#
#   1. Set MICROSOFT_FOUNDRY_API_BASE and MICROSOFT_FOUNDRY_API_KEY
#      in .env.proxy.secrets.
#   2. Uncomment the model block you want (remove "# " before each line).
#   3. Restart the proxy:
#      codefreedom proxy restart
#
# Model specs, pricing, and capabilities change frequently. A long list of
# every available model would be outdated within weeks. One commented example
# and one variation show the pattern — adapt and add from here as needed.
# ──────────────────────────────────────────────────────────────────────────────

# Reference:
# - https://azure.microsoft.com/en-us/pricing/details/azure-openai/
# - https://docs.fireworks.ai/serverless/pricing

