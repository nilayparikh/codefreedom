---
# ── LiteLLM Proxy (Standalone) ───────────────────────────────────────────────
# Self-contained LiteLLM deployment for codefreedom.
#
# DATABASE: Not configured — runs as a pure stateless proxy.
#   No DATABASE_URL = no Prisma, no migrations, no persistence.
#   This means no spend tracking, no key management via UI, no prompt logging.
#   Perfect for dev/CI where you just need model routing.
#
# To add a database (spend tracking, key mgmt, etc.):
#   Set DATABASE_URL=postgresql://user:pass@host:5432/dbname in .env
#   Update litellm/config/config.yaml: set store_model_in_db: true
#
# ── DISABLING PROVIDERS ───────────────────────────────────────────────────
# To disable a provider, comment out or remove its env vars below.
# Cloud-only users: remove the LOCAL_M_* and LOCAL_S_* blocks.
# Local-only users: remove all cloud provider blocks, keep only local.
# LiteLLM will skip any provider whose API key is empty, but removing
# env vars from this file keeps it cleaner. See docs/configuration.md.
# ───────────────────────────────────────────────────────────────────────────

name: codefreedom

services:
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.84.4}
    container_name: ${LITELLM_CONTAINER_NAME:-litellm-codefreedom}
    restart: unless-stopped
    profiles:
      - litellm
      - all
    labels:
      "codefreedom.component": "litellm-proxy"
    command:
      - --config
      - /app/litellm-config/config.yaml
      - --port
      - "${LITELLM_PORT:-4000}"
      - --host
      - "0.0.0.0"
    ports:
      - "${LITELLM_BIND_HOST:-0.0.0.0}:${LITELLM_PORT:-4000}:${LITELLM_PORT:-4000}"
    extra_hosts:
      # Allows LiteLLM to reach local backends on host ports
      - host.docker.internal:host-gateway
    environment:
      # ── Auth ────────────────────────────────────────────────────────────
      # Docker Compose reads .env for ${VAR} interpolation (lowest priority).
      # System env vars override .env (highest priority).
      # .env.secrets is loaded at runtime by codefreedom CLI.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-codefreedom-local}
      LITELLM_LOG_LEVEL: ${LITELLM_LOG_LEVEL:-INFO}

      # LiteLLM config flags
      NO_DOCS: ${LITELLM_NO_DOCS:-True}
      NO_REDOC: ${LITELLM_NO_REDOC:-True}

      # ── Database ───────────────────────────────────────────────────────
      # No DATABASE_URL set — runs as stateless proxy (no Prisma, no DB).
      # To enable database features, set DATABASE_URL in .env:
      #   DATABASE_URL=postgresql://user:pass@host:5432/dbname

      # ── LiteLLM Router Settings ─────────────────────────────────────────
      LITELLM_NUM_RETRIES: ${LITELLM_NUM_RETRIES:-5}
      LITELLM_RETRY_AFTER: ${LITELLM_RETRY_AFTER:-0}
      LITELLM_TIMEOUT_ERROR_RETRIES: ${LITELLM_TIMEOUT_ERROR_RETRIES:-5}
      LITELLM_RATE_LIMIT_ERROR_RETRIES: ${LITELLM_RATE_LIMIT_ERROR_RETRIES:-5}
      LITELLM_INTERNAL_ERROR_RETRIES: ${LITELLM_INTERNAL_ERROR_RETRIES:-5}
      LITELLM_MODEL_ALIAS_ULTRA: ${LITELLM_MODEL_ALIAS_ULTRA:-DeepSeek/DeepSeek-V4-Pro}
      LITELLM_MODEL_ALIAS_PRO: ${LITELLM_MODEL_ALIAS_PRO:-DGX/Qwen3.6-27B}
      LITELLM_MODEL_ALIAS_FLASH: ${LITELLM_MODEL_ALIAS_FLASH:-DeepSeek/DeepSeek-V4-Flash}
      LITELLM_MODEL_ALIAS_AIR: ${LITELLM_MODEL_ALIAS_AIR:-DGX/Qwen3.6-35B-A3B}
      LITELLM_JSON_LOGS: ${LITELLM_JSON_LOGS:-true}
      LITELLM_DROP_PARAMS: ${LITELLM_DROP_PARAMS:-true}
      LITELLM_REDACT_USER_API_KEY: ${LITELLM_REDACT_USER_API_KEY:-true}
      LITELLM_REQUIRE_AUTH_METRICS: ${LITELLM_REQUIRE_AUTH_METRICS:-false}
      LITELLM_TURN_OFF_MSG_LOGGING: ${LITELLM_TURN_OFF_MSG_LOGGING:-false}
      LITELLM_STREAM_USAGE: ${LITELLM_STREAM_USAGE:-true}

      # ── Cloud provider credentials ───────────────────────────────────────
      # Set API keys in .env or .env.secrets; leave empty to disable that provider.
      # To fully disable a cloud provider, also comment out its include line
      # in litellm/config/config.yaml. See docs/configuration.md.
      #
      # DeepSeek (cloud)
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Microsoft Foundry (Azure) — leave API_KEY empty to disable
      MICROSOFT_FOUNDRY_API_BASE: ${MICROSOFT_FOUNDRY_API_BASE:-https://ergox-ca-resource.services.ai.azure.com/openai/v1}
      MICROSOFT_FOUNDRY_API_KEY: ${MICROSOFT_FOUNDRY_API_KEY:-}
      # NVIDIA AI Endpoints — leave API_KEY empty to disable
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # OpenCode Zen — leave API_KEY empty to disable
      OPENCODE_ZEN_BASE_URL: ${OPENCODE_ZEN_BASE_URL:-https://opencode.ai/zen/v1}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}

      # ── Compatible endpoints (bring your own) ──────────────────────────
      # Uncomment and set in .env / .env.secrets to use.
      # OpenAI-compatible (any /v1/chat/completions endpoint)
      # OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-http://localhost:8000/v1}
      # OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-sk-dummy}
      # OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-openai/your-model}
      # Anthropic-compatible (any /v1/messages endpoint)
      # ANTHROPIC_COMPAT_BASE_URL: ${ANTHROPIC_COMPAT_BASE_URL:-http://localhost:8000}
      # ANTHROPIC_COMPAT_API_KEY: ${ANTHROPIC_COMPAT_API_KEY:-sk-dummy}
      # ANTHROPIC_COMPAT_MODEL: ${ANTHROPIC_COMPAT_MODEL:-claude-sonnet-4-20250514}

      # ── Local backends (optional) ──────────────────────────────────────
      # Cloud-only users: comment out this entire block or leave keys empty.
      # Leave LOCAL_M_API_KEY / LOCAL_S_API_KEY empty to disable local models.
      LOCAL_M_BASE_URL: ${LOCAL_M_BASE_URL:-http://host.docker.internal:8000/v1}
      LOCAL_M_API_KEY: ${LOCAL_M_API_KEY:-sk-dummy}
      LOCAL_S_BASE_URL: ${LOCAL_S_BASE_URL:-http://host.docker.internal:8001/v1}
      LOCAL_S_API_KEY: ${LOCAL_S_API_KEY:-sk-dummy}

    networks:
      - codefreedom
    volumes:
      - ./config:/app/litellm-config:ro

networks:
  codefreedom:
    name: codefreedom
    driver: bridge
