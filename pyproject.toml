[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codefreedom"
version = "0.1.3"
description = "Unified CLI for code agents — LLM proxy routing, Docker sandboxing, profile management, and browser tools. All config in ~/.codefreedom."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Nilay Parikh", email = "nilay.parikh@gmail.com" }]
keywords = [
    "claude-code",
    "litellm",
    "ai",
    "llm",
    "local-inference",
    "sandbox",
    "proxy",
    "profiles",
    "docker",
    "browser-automation",
]

# ── Dependencies ────────────────────────────────────────────────────────────
#   PyYAML         — YAML parsing (litellm config validation)
#   types-PyYAML   — type stubs needed by litellm's config parser at runtime
dependencies = ["PyYAML>=6.0", "types-PyYAML"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# ── Optional Dependencies ───────────────────────────────────────────────────
#   dev    — Development extras (type checking, linting, testing)
#            httpx + fastapi are needed to import the web-bridge module
#            (docker/web-bridge/app/bridge.py) in tests.
#   The proxy is always run via `docker compose` against the
#   `codefreedom:litellm-latest` image (docker/litellm/Dockerfile.LiteLLM).
#   No host-side litellm install is required.
[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "ruff>=0.1",
    "pytest>=7.0",
    "types-PyYAML",
    "httpx>=0.28",
    "fastapi>=0.115",
]
docs = ["mkdocs-material[imaging]>=9.7.6", "mkdocs-mermaid2-plugin>=1.2"]
camoufox = ["beautifulsoup4>=4.14.3"]
encrypt = ["cryptography>=42.0"]
ci = ["codefreedom[dev,docs,camoufox,encrypt]"]
all = ["codefreedom[dev,camoufox,encrypt]"]

[project.scripts]
codefreedom = "codefreedom.cli.main:main"
cf = "codefreedom.cli.main:main"

[project.urls]
Homepage = "https://github.com/nilayparikh/codefreedom"
Repository = "https://github.com/nilayparikh/codefreedom"
Documentation = "https://nilayparikh.github.io/codefreedom/"
"Quick Start" = "https://nilayparikh.github.io/codefreedom/quickstart/"
"Proxy Setup" = "https://nilayparikh.github.io/codefreedom/proxy/"
"Claude Code" = "https://nilayparikh.github.io/codefreedom/claude-code/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# All files copied by the init subcommands (claude, proxy, chrome, web).
# Keep this in sync with src/codefreedom/cli/{claude,proxy,chrome,web}.py
# and src/codefreedom/cli/init_utils.py — every file referenced there
# must be listed here so it's included in the wheel/sdist and available
# for first-time `codefreedom ... init` runs.
codefreedom = [
    # Claude code agent — copied by `codefreedom claude init`
    "examples/claude/.env.claude.example",
    "examples/claude/.env.claude.secrets.example",
    "examples/claude/profiles/claude-code.json",
    "examples/claude/profiles/claude-code.schema.json",
    # LiteLLM proxy — copied by `codefreedom proxy init`
    "examples/proxy/.env.proxy.example",
    "examples/proxy/.env.proxy.secrets.example",
    "examples/proxy/config/config.yaml",
    "examples/proxy/docker-compose.yaml",
    "examples/proxy/config/providers/anthropic-compatible.yaml",
    "examples/proxy/config/providers/azure-foundry.yaml",
    "examples/proxy/config/providers/deepseek.yaml",
    "examples/proxy/config/providers/local.yaml",
    "examples/proxy/config/providers/nvidia.yaml",
    "examples/proxy/config/providers/openai-compatible.yaml",
    "examples/proxy/config/providers/opencode-zen.yaml",
    "examples/proxy/config/providers/openrouter.yaml",
    # WebSearch count display patch is baked into the litellm image
    # (see docker/litellm/Dockerfile.LiteLLM and docs/proxy/websearch-interception.md)
    # — no host-side copy needed.
    # Browser tools — copied by `codefreedom tools <tool> init`
    "examples/tools/chrome/chrome.json",
    "examples/tools/chrome/chrome.schema.json",
    "examples/tools/web/web.json",
    "examples/tools/web/web.schema.json",
]

# ── Pylint ───────────────────────────────────────────────────────────────────
[tool.pylint.messages_control]
disable = [
    "C0103",                                  # invalid-name — too strict for project naming conventions
    "C0301",                                  # allow long lines for better readability in some cases
    "missing-function-docstring",             # tests don't need per-method docstrings
    "missing-class-docstring",                # test classes are self-documenting
    "unused-import",                          # pytest fixture imports look unused
    "use-implicit-booleaness-not-comparison", # assert == {} is clearer in tests
    "protected-access",                       # tests intentionally call underscore-prefixed helpers
]

[tool.pylint.main]
# Tests don't need docstrings on every method, and pytest is used implicitly
ignored-modules = ["tests.*"]

[tool.mypy]
ignore_missing_imports = true
