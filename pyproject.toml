[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codefreedom"
version = "0.0.3"
description = "Single wrapper for all code agents — simple LLM routing, sandboxing, profile management, and isolation. All config in ~/.codefreedom."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Nilay Parikh", email = "nilay.parikh@gmail.com" }]
keywords = ["claude-code", "litellm", "ai", "llm", "local-inference"]

# ── Dependencies ────────────────────────────────────────────────────────────
#   PyYAML         — YAML parsing (litellm config validation)
#   types-PyYAML   — type stubs needed by litellm's config parser at runtime
dependencies = ["PyYAML>=6.0", "types-PyYAML"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# ── Optional Dependencies ───────────────────────────────────────────────────
#   litellm[proxy]  — LiteLLM proxy with all extras (websockets, gunicorn, etc.)
#                     Required for: codefreedom proxy --up --native
#                     Not needed for Docker Compose mode.
#   dev             — Development extras (type checking, linting)
[project.optional-dependencies]
litellm = ["litellm[proxy]>=1.50", "prometheus-client>=0.20"]
dev = ["mypy>=1.0", "ruff>=0.1", "pytest>=7.0", "types-PyYAML"]
docs = ["mkdocs-material[imaging]>=9.6", "mkdocs-mermaid2-plugin>=1.2"]
all = ["codefreedom[litellm,dev,docs]"]

[project.scripts]
codefreedom = "codefreedom.cli.main:main"
cf = "codefreedom.cli.main:main"

[project.urls]
Homepage = "https://github.com/nilayparikh/codefreedom"
Repository = "https://github.com/nilayparikh/codefreedom"
Documentation = "https://nilayparikh.github.io/codefreedom/"
"Quick Start" = "https://nilayparikh.github.io/codefreedom/quickstart/"
"Proxy Setup" = "https://nilayparikh.github.io/codefreedom/proxy/"
"Claude Code" = "https://nilayparikh.github.io/codefreedom/claude-code/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codefreedom = [
    "examples/.env.example",
    "examples/.env.secrets.example",
    "examples/profiles/*.json",
    "examples/proxy/*.yaml",
    "examples/proxy/providers/*.yaml",
]

# ── Pylint ───────────────────────────────────────────────────────────────────
[tool.pylint.messages_control]
disable = [
    "C0103",                                  # invalid-name — too strict for project naming conventions
    "C0301",                                  # allow long lines for better readability in some cases
    "missing-function-docstring",             # tests don't need per-method docstrings
    "missing-class-docstring",                # test classes are self-documenting
    "unused-import",                          # pytest fixture imports look unused
    "use-implicit-booleaness-not-comparison", # assert == {} is clearer in tests
]

[tool.pylint.main]
# Tests don't need docstrings on every method, and pytest is used implicitly
ignored-modules = ["tests.*"]

[tool.mypy]
ignore_missing_imports = true
