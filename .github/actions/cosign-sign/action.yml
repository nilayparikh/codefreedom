name: cosign-sign
description: >
  Keyless-sign a container image with Sigstore cosign using GitHub OIDC.
  Caller is responsible for any registry login (cosign reads the local
  Docker config at ~/.docker/config.json). The signed identity is bound
  to the workflow run; consumers verify against
  --certificate-oidc-issuer=https://token.actions.githubusercontent.com.

inputs:
  image:
    description: Fully qualified image ref, including @sha256:... digest.
    required: true
  cosign-release:
    description: Cosign release tag to install.
    required: false
    default: "v2.4.1"

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: ${{ inputs.cosign-release }}

    - name: Sign image
      shell: bash
      run: cosign sign --yes "${{ inputs.image }}"
