# ── CodeFreedom: Docker Chrome (Browser) ───────────────────────────────────────
# Builds and publishes the Chrome browser automation image.
# Triggered by changes to docker/chrome/Dockerfile.Chrome.
#
# Tags: chrome-v{semver}, chrome-v{major.minor}, chrome-latest
# Platforms: linux/arm64, linux/amd64
# Registries: docker.io/nilayparikh/codefreedom · ghcr.io/nilayparikh/codefreedom
# ────────────────────────────────────────────────────────────────────────────────

name: Docker Chrome

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["docker/chrome/Dockerfile.Chrome"]
  pull_request:
    paths: ["docker/chrome/Dockerfile.Chrome"]
  workflow_dispatch:

env:
  DOCKER_HUB_REPO: nilayparikh/codefreedom
  GHCR_REPO: ghcr.io/nilayparikh/codefreedom

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "📦 Version: v${VERSION}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=chrome-v${{ steps.version.outputs.version }}
            type=raw,value=chrome-v${{ steps.version.outputs.major_minor }}
            type=raw,value=chrome-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Chrome Browser
            org.opencontainers.image.description=Chrome + Xvfb for undetectable headed browsing via CDP port 9222
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=Chrome

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/chrome/
          file: docker/chrome/Dockerfile.Chrome
          platforms: linux/arm64,linux/amd64
          build-args: |
            CODEFREEDOM_VERSION=v${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=Chrome
          cache-to: type=gha,mode=max,scope=Chrome

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
