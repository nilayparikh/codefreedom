# ── CodeFreedom: Docker Unified (All Agents, All Platforms) ─────────────────────
# Builds and publishes unified images containing all 3 coding agent CLIs.
# Matrix strategy: ubuntu, cuda, rocm platforms.
#
# Tags: unified-{platform}-v{semver}, unified-{platform}-latest
# Platforms: linux/arm64, linux/amd64 (rocm: amd64 only)
# Registries: docker.io/nilayparikh/codefreedom · ghcr.io/nilayparikh/codefreedom
# ────────────────────────────────────────────────────────────────────────────────

name: Docker Unified

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.2.1, beta)"
        required: true
        type: string
      latest:
        description: "Tag as latest"
        required: false
        type: boolean
        default: true
      platform:
        description: "Platform to build (all, ubuntu, cuda, rocm)"
        required: false
        type: choice
        options:
          - all
          - ubuntu
          - cuda
          - rocm
        default: all

env:
  DOCKER_HUB_REPO: nilayparikh/codefreedom
  GHCR_REPO: ghcr.io/nilayparikh/codefreedom

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            target: ubuntu
            platforms: linux/arm64,linux/amd64
            scope: Unified-Ubuntu
          - platform: cuda
            target: cuda
            platforms: linux/arm64,linux/amd64
            scope: Unified-CUDA
          - platform: rocm
            target: rocm
            platforms: linux/amd64
            scope: Unified-ROCm
    runs-on: ubuntu-24.04
    if: >-
      inputs.platform == 'all' || inputs.platform == matrix.platform
    outputs:
      digest-ubuntu: ${{ steps.digest.outputs.digest-ubuntu }}
      digest-cuda: ${{ steps.digest.outputs.digest-cuda }}
      digest-rocm: ${{ steps.digest.outputs.digest-rocm }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^ARG IMAGE_VERSION=' docker/unified/Dockerfile.Unified | head -1 | sed 's/.*=\(.*\)/\1/')
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=unified-${{ matrix.platform }}-${{ inputs.tag }}
            type=raw,value=unified-${{ matrix.platform }}-latest,enable=${{ inputs.latest }}
            type=raw,value=claude-code-${{ inputs.tag }},enable=${{ matrix.platform == 'ubuntu' }}
            type=raw,value=claude-code-latest,enable=${{ inputs.latest && matrix.platform == 'ubuntu' }}
            type=raw,value=claude-code-cuda-${{ inputs.tag }},enable=${{ matrix.platform == 'cuda' }}
            type=raw,value=claude-code-cuda-latest,enable=${{ inputs.latest && matrix.platform == 'cuda' }}
            type=raw,value=claude-code-rocm-${{ inputs.tag }},enable=${{ matrix.platform == 'rocm' }}
            type=raw,value=claude-code-rocm-latest,enable=${{ inputs.latest && matrix.platform == 'rocm' }}
            type=raw,value=mimo-code-${{ inputs.tag }},enable=${{ matrix.platform == 'ubuntu' }}
            type=raw,value=mimo-code-latest,enable=${{ inputs.latest && matrix.platform == 'ubuntu' }}
            type=raw,value=mimo-code-cuda-${{ inputs.tag }},enable=${{ matrix.platform == 'cuda' }}
            type=raw,value=mimo-code-cuda-latest,enable=${{ inputs.latest && matrix.platform == 'cuda' }}
            type=raw,value=mimo-code-rocm-${{ inputs.tag }},enable=${{ matrix.platform == 'rocm' }}
            type=raw,value=mimo-code-rocm-latest,enable=${{ inputs.latest && matrix.platform == 'rocm' }}
            type=raw,value=open-code-${{ inputs.tag }},enable=${{ matrix.platform == 'ubuntu' }}
            type=raw,value=open-code-latest,enable=${{ inputs.latest && matrix.platform == 'ubuntu' }}
            type=raw,value=open-code-cuda-${{ inputs.tag }},enable=${{ matrix.platform == 'cuda' }}
            type=raw,value=open-code-cuda-latest,enable=${{ inputs.latest && matrix.platform == 'cuda' }}
            type=raw,value=open-code-rocm-${{ inputs.tag }},enable=${{ matrix.platform == 'rocm' }}
            type=raw,value=open-code-rocm-latest,enable=${{ inputs.latest && matrix.platform == 'rocm' }}
          labels: |
            org.opencontainers.image.title=CodeFreedom - Unified (${{ matrix.platform }})
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=${{ matrix.platform }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/unified/
          file: docker/unified/Dockerfile.Unified
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Export digest
        id: digest
        run: |
          echo "digest-${{ matrix.platform }}=${{ steps.build.outputs.digest }}" >> "${GITHUB_OUTPUT}"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign Docker Hub image
        uses: ./.github/actions/cosign-sign
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ steps.build.outputs.digest }}

      - name: Sign GHCR image
        uses: ./.github/actions/cosign-sign
        with:
          image: ${{ env.GHCR_REPO }}@${{ steps.build.outputs.digest }}

  verify:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, cuda, rocm]
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get digest
        id: get-digest
        run: |
          DIGEST="${{ needs.build.outputs[format('digest-{0}', matrix.platform)] }}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Verify Docker Hub signature
        if: steps.get-digest.outputs.digest != ''
        uses: ./.github/actions/cosign-verify
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ steps.get-digest.outputs.digest }}

      - name: Verify GHCR signature
        if: steps.get-digest.outputs.digest != ''
        uses: ./.github/actions/cosign-verify
        with:
          image: ${{ env.GHCR_REPO }}@${{ steps.get-digest.outputs.digest }}
