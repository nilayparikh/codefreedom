# ── CodeFreedom: Docker LiteLLM Base ─────────────────────────────────────
# Builds the LiteLLM + deps base image on top of the PG base.
# MANUALLY triggered — rebuild when LITELLM_TAG, requirements.txt,
# patches/, or plugins/ change.
#
# Tags: litellm-base-v{litellm_tag}, litellm-base-latest
# Platforms: linux/arm64, linux/amd64
# ─────────────────────────────────────────────────────────────────────────

name: Docker LiteLLM Base

on:
  workflow_dispatch:
    inputs:
      litellm_tag:
        description: "LiteLLM git tag (e.g. v1.87.1)"
        required: true
        default: "v1.87.1"
      pg_base_tag:
        description: "PG base image tag (e.g. litellm-pg-base-v18.4)"
        required: true
        default: "litellm-pg-base-latest"

env:
  DOCKER_HUB_REPO: nilayparikh/codefreedom
  GHCR_REPO: ghcr.io/nilayparikh/codefreedom

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=litellm-base-${{ inputs.litellm_tag }}
            type=raw,value=litellm-base-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - LiteLLM Base
            org.opencontainers.image.description=LiteLLM ${{ inputs.litellm_tag }} + deps + Prisma on top of PG base.
            org.opencontainers.image.version=${{ inputs.litellm_tag }}
            com.codefreedom.platform=LiteLLM

      - name: Build and push
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        with:
          context: docker/litellm/
          file: docker/litellm/Dockerfile.LitellmBase
          platforms: linux/arm64,linux/amd64
          build-args: |
            LITELLM_TAG=${{ inputs.litellm_tag }}
            PG_BASE_IMAGE=${{ env.DOCKER_HUB_REPO }}:${{ inputs.pg_base_tag }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=LiteLLM-Base
          cache-to: type=gha,mode=max,scope=LiteLLM-Base

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2  # v2.2.3
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign Docker Hub image
        uses: ./.github/actions/cosign-sign
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ steps.build.outputs.digest }}

      - name: Sign GHCR image
        uses: ./.github/actions/cosign-sign
        with:
          image: ${{ env.GHCR_REPO }}@${{ steps.build.outputs.digest }}

  verify:
    needs: build
    runs-on: ubuntu-24.04
    if: needs.build.outputs.digest != ''
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker Hub signature
        uses: ./.github/actions/cosign-verify
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ needs.build.outputs.digest }}

      - name: Verify GHCR signature
        uses: ./.github/actions/cosign-verify
        with:
          image: ${{ env.GHCR_REPO }}@${{ needs.build.outputs.digest }}
