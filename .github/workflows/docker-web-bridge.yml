# ── CodeFreedom: Docker Web Bridge (SearXNG-shaped MCP proxy) ────────────────
# Builds and publishes the web-bridge sidecar image.
# Triggered by changes to docker/web-bridge/Dockerfile.Bridge.
#
# Tags: web-bridge-v{semver}, web-bridge-v{major.minor}, web-bridge-latest
# Platforms: linux/arm64, linux/amd64
# Registries: docker.io/nilayparikh/codefreedom · ghcr.io/nilayparikh/codefreedom
# ────────────────────────────────────────────────────────────────────────────────

name: Docker Web Bridge

on:
  push:
    branches: [main]
    paths: ["docker/web-bridge/Dockerfile.Bridge"]
  workflow_dispatch:

env:
  DOCKER_HUB_REPO: nilayparikh/codefreedom
  GHCR_REPO: ghcr.io/nilayparikh/codefreedom

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^ARG IMAGE_VERSION=' docker/web-bridge/Dockerfile.Bridge | head -1 | sed 's/.*=\(.*\)/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "📦 Version: v${VERSION}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=web-bridge-v${{ steps.version.outputs.version }}
            type=raw,value=web-bridge-v${{ steps.version.outputs.major_minor }}
            type=raw,value=web-bridge-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Web Bridge
            org.opencontainers.image.description=SearXNG-shaped FastAPI bridge in front of the CodeFreedom Camoufox MCP web_search tool
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=Web Bridge

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/web-bridge/
          file: docker/web-bridge/Dockerfile.Bridge
          platforms: linux/arm64,linux/amd64
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=WebBridge
          cache-to: type=gha,mode=max,scope=WebBridge

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
