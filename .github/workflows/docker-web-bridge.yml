# ── CodeFreedom: Docker Web Bridge (SearXNG-shaped MCP proxy) ────────────────
# Builds and publishes the web-bridge sidecar image.
# Trigger: manual dispatch only.
#
# Tags: web-bridge-v{semver}, web-bridge-v{major.minor}, web-bridge-latest
# Platforms: linux/arm64, linux/amd64
# Registries: docker.io/nilayparikh/codefreedom · ghcr.io/nilayparikh/codefreedom
# ────────────────────────────────────────────────────────────────────────────────

name: Docker Web Bridge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.2.1, beta)"
        required: true
        type: string
      latest:
        description: "Tag as latest"
        required: false
        type: boolean
        default: true

env:
  DOCKER_HUB_REPO: nilayparikh/codefreedom
  GHCR_REPO: ghcr.io/nilayparikh/codefreedom

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^ARG IMAGE_VERSION=' docker/web-bridge/Dockerfile.Bridge | head -1 | sed 's/.*=\(.*\)/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "📦 Version: v${VERSION}"

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=web-bridge-${{ inputs.tag }}
            type=raw,value=web-bridge-latest,enable=${{ inputs.latest }}
          labels: |
            org.opencontainers.image.title=CodeFreedom - Web Bridge
            org.opencontainers.image.description=SearXNG-shaped FastAPI bridge in front of the CodeFreedom Camoufox MCP web_search tool
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=Web Bridge

      - name: Build and push
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        with:
          context: docker/web-bridge/
          file: docker/web-bridge/Dockerfile.Bridge
          platforms: linux/arm64,linux/amd64
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=WebBridge
          cache-to: type=gha,mode=max,scope=WebBridge

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2  # v2.2.3
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign Docker Hub image
        uses: ./.github/actions/cosign-sign
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ steps.build.outputs.digest }}

      - name: Sign GHCR image
        uses: ./.github/actions/cosign-sign
        with:
          image: ${{ env.GHCR_REPO }}@${{ steps.build.outputs.digest }}

  verify:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker Hub signature
        uses: ./.github/actions/cosign-verify
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ needs.build.outputs.digest }}

      - name: Verify GHCR signature
        uses: ./.github/actions/cosign-verify
        with:
          image: ${{ env.GHCR_REPO }}@${{ needs.build.outputs.digest }}
