# ── CodeFreedom Release Workflow ──────────────────────────────────────────────
# Creates and pushes a tag. The tag is the single source of truth for the version.
# Version is derived from the tag at runtime — pyproject.toml is NEVER modified.
#
# Trigger: workflow_dispatch with version input.
# Branch requirements:
#   - Dev releases: must be on prerelease/v* branch
#   - RC releases: must be on release/v* branch
#   - Final releases: must be on main branch
#
# After tagging, trigger pipy.yaml manually to publish to PyPI.
# Tags are NOT protected by branch protection rules.
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version (e.g., 0.2.1)"
        required: true
        type: string
      pre-release:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      type:
        description: "Pre-release type: dev or rc"
        required: false
        type: choice
        options:
          - rc
          - dev
        default: "rc"
      candidate:
        description: "Release candidate number (required if type=rc)"
        required: false
        type: string
        default: ""
      dev-number:
        description: "Dev number (required if type=dev)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      full_version: ${{ steps.resolve.outputs.full_version }}
      tag: ${{ steps.resolve.outputs.tag }}
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          VERSION="${{ inputs.version }}"
          IS_PRE="${{ inputs.pre-release }}"
          TYPE="${{ inputs.type }}"
          CANDIDATE="${{ inputs.candidate }}"
          DEV_NUM="${{ inputs.dev-number }}"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # Validate version format
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version must be X.Y.Z format, got: $VERSION"
            exit 1
          fi

          # Build full version string
          if [ "$IS_PRE" = "true" ]; then
            if [ "$TYPE" = "rc" ]; then
              if [ -z "$CANDIDATE" ]; then
                echo "Error: type=rc requires candidate number"
                exit 1
              fi
              FULL_VERSION="${VERSION}rc${CANDIDATE}"
              TAG="v${FULL_VERSION}"

              # Validate branch for RC
              if [[ "$BRANCH" != release/v* ]]; then
                echo "Error: RC releases require release/v* branch. Current: $BRANCH"
                exit 1
              fi
            elif [ "$TYPE" = "dev" ]; then
              if [ -z "$DEV_NUM" ]; then
                echo "Error: type=dev requires dev-number"
                exit 1
              fi
              FULL_VERSION="${VERSION}.dev${DEV_NUM}"
              TAG="v${FULL_VERSION}"

              # Validate branch for dev
              if [[ "$BRANCH" != prerelease/v* ]]; then
                echo "Error: dev releases require prerelease/v* branch. Current: $BRANCH"
                exit 1
              fi
            else
              echo "Error: type must be 'dev' or 'rc', got: $TYPE"
              exit 1
            fi
          else
            FULL_VERSION="$VERSION"
            TAG="v${FULL_VERSION}"

            # Validate branch for final
            if [ "$BRANCH" != "main" ]; then
              echo "Error: final releases require main branch. Current: $BRANCH"
              exit 1
            fi
          fi

          # Check working tree is clean
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: working tree is dirty"
            git status --short
            exit 1
          fi

          # Check tag doesn't already exist
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: tag $TAG already exists"
            exit 1
          fi

          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          echo "Release: $FULL_VERSION (tag: $TAG)"
          echo "Branch: $BRANCH"

  release:
    name: Create release
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tag current commit
        run: |
          TAG="${{ needs.validate.outputs.tag }}"

          git tag -a "$TAG" -m "Release ${TAG}"

          echo "Tagged: $TAG"

      - name: Push tag
        run: |
          TAG="${{ needs.validate.outputs.tag }}"

          git push origin "$TAG"

          echo "Pushed tag $TAG to origin"
          echo ""
          echo "Next: Trigger pipy.yaml manually to publish to PyPI"
