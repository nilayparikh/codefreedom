# ── CodeFreedom CI ────────────────────────────────────────────────────────────
# Unit tests (fast) + integration tests (build, install, smoke).
#
# Required for PR merge — configure branch protection on main:
#   Settings → Branches → Branch protection rules → Require status checks:
#     - unit-tests (3.10)
#     - unit-tests (3.11)
#     - unit-tests (3.12)
#     - integration (ubuntu-24.04 / py3.12)
#     - integration (windows-2022 / py3.12)
#     - integration (macos-14 / py3.12)
#
# Platforms: ubuntu-24.04, windows-2022, macos-14
# ────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ── Unit tests (fast, Python matrix only) ───────────────────────────────
  unit-tests:
    name: "unit-tests (${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Lint (ruff)
        run: |
          ruff check src/ tests/

      - name: Type-check (mypy)
        run: |
          mypy src/

      - name: Test
        run: |
          python -m pytest tests/ -v --tb=short

  # ── Integration tests (build wheel, install, smoke test, cross-platform) ─
  integration:
    name: "integration (${{ matrix.os }} / py${{ matrix.python-version }})"
    needs: unit-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-14
        python-version:
          - "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and verify artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/
          test -f dist/codefreedom-*.tar.gz || { echo "MISSING: sdist"; exit 1; }
          test -f dist/codefreedom-*.whl   || { echo "MISSING: wheel"; exit 1; }

      - name: Install from wheel and smoke test
        run: |
          WHEEL=$(ls dist/codefreedom-*.whl | head -1)
          pip install "$WHEEL" --force-reinstall

          # CLI entry points
          codefreedom --help
          cf --help
          codefreedom claude --help
          cf cc --help
          codefreedom proxy --help
          cf px --help

          # Init (install _default base recipe)
          codefreedom init recipe

          # Verify core structure was created
          test -f ~/.codefreedom/.env.user || { echo "MISSING: .env.user"; exit 1; }
          test -f ~/.codefreedom/proxy/config/config.yaml || { echo "MISSING: proxy config"; exit 1; }
          test -f ~/.codefreedom/proxy/docker-compose.yaml || { echo "MISSING: compose"; exit 1; }
          test -f ~/.codefreedom/profiles/chrome.yaml || { echo "MISSING: chrome profile"; exit 1; }
          test -f ~/.codefreedom/profiles/web.yaml || { echo "MISSING: web profile"; exit 1; }
          test -f ~/.codefreedom/profiles/github.yaml || { echo "MISSING: github profile"; exit 1; }
          test -f ~/.codefreedom/profiles/web-bridge.yaml || { echo "MISSING: web-bridge profile"; exit 1; }
          test -f ~/.codefreedom/.env.claude || { echo "MISSING: .env.claude"; exit 1; }
          test -f ~/.codefreedom/.env.proxy || { echo "MISSING: .env.proxy"; exit 1; }

          # Validate proxy config YAML
          python -c "
          import yaml
          from pathlib import Path
          p = Path.home() / '.codefreedom' / 'proxy' / 'config' / 'config.yaml'
          d = yaml.safe_load(p.read_text())
          assert 'model_list' in d, 'config.yaml should contain model_list'
          assert 'general_settings' in d, 'config.yaml should contain general_settings'
          print('[CONFIG OK]')
          "

          # Validate tool profile YAMLs
          python -c "
          import yaml
          from pathlib import Path
          for name in ['chrome', 'web', 'github', 'web-bridge']:
              p = Path.home() / '.codefreedom' / 'profiles' / f'{name}.yaml'
              d = yaml.safe_load(p.read_text())
              assert isinstance(d, dict), f'{name}.yaml should be valid YAML'
          print('[PROFILES OK]')
          "

          # Profile listing
          codefreedom claude --list-profiles

          # Proxy validate
          codefreedom proxy validate 2>&1 || true

          # CLI dry-run
          export LITELLM_MASTER_KEY="sk-test-dummy-key-for-ci"
          codefreedom claude --help 2>&1 || true
