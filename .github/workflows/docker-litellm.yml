# ── CodeFreedom: Docker LiteLLM (self-contained proxy image) ────────────────
# Builds and publishes the self-hosted LiteLLM proxy image that replaces
# ghcr.io/berriai/litellm in the compose stack. The image bakes in the
# WebSearch count display patch (see docker/litellm/patch_websearch_count.py).
#
# Triggered by changes to docker/litellm/Dockerfile.LiteLLM or its
# requirements.txt. Manually dispatchable for rebuilds on dependency bumps.
#
# Tags: litellm-v{semver}, litellm-v{major.minor}, litellm-latest
# Platforms: linux/arm64, linux/amd64
# Registries: docker.io/nilayparikh/codefreedom · ghcr.io/nilayparikh/codefreedom
# ────────────────────────────────────────────────────────────────────────────

name: Docker LiteLLM

on:
  push:
    branches: [main, prerelease]
    paths:
      - "docker/litellm/Dockerfile.LiteLLM"
      - "docker/litellm/requirements.txt"
      - "docker/litellm/patch_websearch_count.py"
  workflow_dispatch:

env:
  DOCKER_HUB_REPO: nilayparikh/codefreedom
  GHCR_REPO: ghcr.io/nilayparikh/codefreedom

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Extract image version
        id: version
        run: |
          VERSION=$(grep '^ARG IMAGE_VERSION=' docker/litellm/Dockerfile.LiteLLM | head -1 | sed 's/.*=\(.*\)/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "LiteLLM image version: v${VERSION}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=litellm-v${{ steps.version.outputs.version }}
            type=raw,value=litellm-v${{ steps.version.outputs.major_minor }}
            type=raw,value=litellm-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - LiteLLM Proxy
            org.opencontainers.image.description=Self-hosted LiteLLM proxy with the WebSearch count display patch baked in. Replaces ghcr.io/berriai/litellm in the codefreedom run proxy stack.
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=LiteLLM

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/litellm/
          file: docker/litellm/Dockerfile.LiteLLM
          platforms: linux/arm64,linux/amd64
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=LiteLLM
          cache-to: type=gha,mode=max,scope=LiteLLM

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign Docker Hub image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/cosign-sign
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ steps.build.outputs.digest }}

      - name: Sign GHCR image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/cosign-sign
        with:
          image: ${{ env.GHCR_REPO }}@${{ steps.build.outputs.digest }}

  verify:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && needs.build.outputs.digest != ''
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker Hub signature
        uses: ./.github/actions/cosign-verify
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ needs.build.outputs.digest }}

      - name: Verify GHCR signature
        uses: ./.github/actions/cosign-verify
        with:
          image: ${{ env.GHCR_REPO }}@${{ needs.build.outputs.digest }}
