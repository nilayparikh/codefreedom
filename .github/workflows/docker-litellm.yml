# ── CodeFreedom: Docker LiteLLM (final image) ────────────────────────────
# Builds the thin runtime overlay on top of the pre-built litellm-base
# checkpoint image.  Only patches, plugins, entrypoint, and runtime setup.
#
# Build time: ~1-2 minutes (no compilation, no pip install, no Prisma).
#
# For full base rebuilds, use the docker-litellm-pg-base and
# docker-litellm-base workflows instead.
#
# Tags: litellm-v{semver}, litellm-v{major.minor}, litellm-latest
# Platforms: linux/arm64, linux/amd64
# Registries: docker.io/nilayparikh/codefreedom · ghcr.io/nilayparikh/codefreedom
# ────────────────────────────────────────────────────────────────────────────

name: Docker LiteLLM

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.2.1, beta)"
        required: true
        type: string
      latest:
        description: "Tag as latest"
        required: false
        type: boolean
        default: true
      litellm_base_tag:
        description: "Override litellm-base image tag (e.g. litellm-base-v1.87.1)"
        required: false
        default: ""

env:
  DOCKER_HUB_REPO: nilayparikh/codefreedom
  GHCR_REPO: ghcr.io/nilayparikh/codefreedom

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4

      - name: Extract image version
        id: version
        run: |
          VERSION=$(grep '^ARG IMAGE_VERSION=' docker/litellm/Dockerfile.LitellmFinal | head -1 | sed 's/.*=\(.*\)/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "LiteLLM image version: v${VERSION}"

      - name: Resolve base image tag
        id: base
        run: |
          if [ -n "${{ inputs.litellm_base_tag }}" ]; then
            echo "tag=${{ inputs.litellm_base_tag }}" >> "${GITHUB_OUTPUT}"
          else
            DEFAULT=$(grep '^ARG LITELLM_BASE_IMAGE=' docker/litellm/Dockerfile.LitellmFinal | head -1 | sed 's/.*:\(.*\)/\1/')
            echo "tag=${DEFAULT}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=litellm-${{ inputs.tag }}
            type=raw,value=litellm-latest,enable=${{ inputs.latest }}
          labels: |
            org.opencontainers.image.title=CodeFreedom - LiteLLM Proxy
            org.opencontainers.image.description=Self-hosted LiteLLM proxy with the WebSearch count display patch baked in. Replaces ghcr.io/berriai/litellm in the codefreedom run proxy stack.
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=LiteLLM

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: docker/litellm/
          file: docker/litellm/Dockerfile.LitellmFinal
          platforms: linux/arm64,linux/amd64
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            LITELLM_BASE_IMAGE=${{ env.DOCKER_HUB_REPO }}:${{ steps.base.outputs.tag }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=LiteLLM-Final
          cache-to: type=gha,mode=max,scope=LiteLLM-Final

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215  # v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign Docker Hub image
        uses: ./.github/actions/cosign-sign
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ steps.build.outputs.digest }}

      - name: Sign GHCR image
        uses: ./.github/actions/cosign-sign
        with:
          image: ${{ env.GHCR_REPO }}@${{ steps.build.outputs.digest }}

  verify:
    needs: build
    runs-on: ubuntu-24.04
    if: needs.build.outputs.digest != ''
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker Hub signature
        uses: ./.github/actions/cosign-verify
        with:
          image: docker.io/${{ env.DOCKER_HUB_REPO }}@${{ needs.build.outputs.digest }}

      - name: Verify GHCR signature
        uses: ./.github/actions/cosign-verify
        with:
          image: ${{ env.GHCR_REPO }}@${{ needs.build.outputs.digest }}
