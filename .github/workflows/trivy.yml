# ── CodeFreedom Security Scan Workflow ───────────────────────────────────────
# Scans the repository for secrets, misconfigurations, and vulnerabilities.
# ────────────────────────────────────────────────────────────────────────────────

name: Trivy

on:
  push:
    branches: [main, "prerelease/v*", "release/v*"]
  pull_request:
    branches: [main, "prerelease/v*", "release/v*"]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  scan:
    name: Full Repository Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Run Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: fs
          scan-ref: "."
          format: table
          exit-code: 1
          ignore-unfixed: true
