# ── CodeFreedom PR Title Linter ───────────────────────────────────────────────
# Validates PR titles follow Conventional Commits format.
# This replaces the commit-lint job in ci.yml.
#
# Why PR title instead of commit message?
# - PR titles are user-controlled (not auto-generated like merge commits)
# - Squash merge uses PR title as commit message
# - No false failures from merge commits
#
# Requires repo setting: "Default to pull request title" for squash merges.
# ──────────────────────────────────────────────────────────────────────────────

name: Lint PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR Title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
