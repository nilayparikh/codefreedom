# ── CodeFreedom CI ────────────────────────────────────────────────────────────
# Unified CI for all branches and PRs.
#
# Runs on:
#   - Push to main, prerelease/*, release/*
#   - PRs to main, prerelease/*, release/*
#   - Manual dispatch (any branch)
#
# What runs (chained):
#   - lint-configs → unit-tests → integration (on every push and PR)
#
# Replaces: gated-checkin.yml, integration-test.yml, pr-check.yml
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - main
      - "prerelease/v*"
      - "release/v*"
  pull_request:
    branches:
      - main
      - "prerelease/v*"
      - "release/v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ── Lint workflows (actionlint) + Dockerfiles (hadolint) ───────────────
  lint-configs:
    name: Lint configs (workflows + Dockerfiles)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Lint workflows with actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-review
          level: warning
          filter_mode: added

      - name: Lint Dockerfiles with hadolint
        run: |
          for f in $(find docker -name "Dockerfile.*" 2>/dev/null); do
            echo "Linting: $f"
            docker run --rm -i hadolint/hadolint < "$f" || true
          done

  # ── Unit tests (fast, ~2s) ────────────────────────────────────────────
  unit-tests:
    name: "unit-tests (${{ matrix.python-version }})"
    needs: lint-configs
    if: always() && !cancelled() && needs.lint-configs.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -m unit -v --tb=short

  # ── Integration tests (full suite, ~10s) ──────────────────────────────
  integration:
    name: "integration (${{ matrix.os }} / py${{ matrix.python-version }})"
    needs: unit-tests
    if: always() && !cancelled() && needs.unit-tests.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/ -m integration -v --tb=short
