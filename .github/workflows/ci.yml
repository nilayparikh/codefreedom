# ── CodeFreedom CI ────────────────────────────────────────────────────────────
# Unified CI for all branches and PRs.
#
# Runs on:
#   - Push to main, prerelease/*, release/*
#   - PRs to main, prerelease/*, release/*
#   - Manual dispatch (any branch)
#
# What runs (chained):
#   - commit-lint → lint-configs → unit-tests → integration (on every push and PR)
#
# Replaces: gated-checkin.yml, integration-test.yml, pr-check.yml
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - main
      - "prerelease/v*"
      - "release/v*"
  pull_request:
    branches:
      - main
      - "prerelease/v*"
      - "release/v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ── Conventional commit lint (gate for all downstream jobs) ─────────────
  commit-lint:
    name: Validate commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check conventional commits
        run: |
          # Determine commit range based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            COMMITS=$(git log --pretty=format:"%s" "$BASE"..HEAD)
            echo "Commits in this PR:"
          else
            BEFORE="${{ github.event.before }}"
            # Initial push (before is all zeros) — check only the tip commit
            if echo "$BEFORE" | grep -qE '^0+$'; then
              COMMITS=$(git log --pretty=format:"%s" -1)
              echo "Initial push — checking tip commit:"
            else
              COMMITS=$(git log --pretty=format:"%s" "$BEFORE"..HEAD)
              echo "Commits in this push:"
            fi
          fi

          echo "$COMMITS"
          echo ""

          PATTERN="^(feat|fix|perf|refactor|doc|ci|chore|test|style|revert)(\(.+\))?: .{1,}"
          FAILURES=0
          while IFS= read -r msg; do
            # Skip merge commits (generated by GitHub, not user-controlled)
            if echo "$msg" | grep -qE "^Merge [a-f0-9]+ into |^Merge branch "; then
              continue
            fi
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "FAIL: '$msg'"
              echo "  Expected: type(scope): description"
              FAILURES=$((FAILURES + 1))
            fi
          done <<< "$COMMITS"

          if [ $FAILURES -gt 0 ]; then
            echo ""
            echo "$FAILURES commit(s) do not follow Conventional Commits."
            echo "See: https://www.conventionalcommits.org/"
            exit 1
          fi

          echo "All commits follow Conventional Commits."

  # ── Lint workflows (actionlint) + Dockerfiles (hadolint) ───────────────
  lint-configs:
    name: Lint configs (workflows + Dockerfiles)
    needs: commit-lint
    if: always() && !cancelled() && needs.commit-lint.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows (actionlint)
        uses: reviewdog/action-actionlint@v1

      - name: Lint Dockerfiles (hadolint)
        run: |
          find docker -name 'Dockerfile.*' -type f -print0 | while IFS= read -r -d '' df; do
            echo "::group::hadolint $df"
            docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < "$df" || true
            echo "::endgroup::"
          done

  # ── Lint + Type-check + Unit tests (fast, Python matrix) ────────────────
  unit-tests:
    name: "unit-tests (${{ matrix.python-version }})"
    needs: lint-configs
    if: always() && !cancelled() && needs.lint-configs.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Test
        run: python -m pytest tests/ -v --tb=short

  # ── Integration tests (build wheel, install, smoke test) ────────────────
  integration:
    name: "integration (${{ matrix.os }} / py${{ matrix.python-version }})"
    needs: unit-tests
    if: always() && !cancelled() && needs.unit-tests.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-14
        python-version:
          - "3.12"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and verify artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/
          test -f dist/codefreedom-*.tar.gz || { echo "MISSING: sdist"; exit 1; }
          test -f dist/codefreedom-*.whl   || { echo "MISSING: wheel"; exit 1; }

      - name: Install from wheel and smoke test
        run: |
          WHEEL=$(find dist -name 'codefreedom-*.whl' -type f | head -1)
          pip install "$WHEEL" --force-reinstall

          codefreedom --help
          cf --help
          codefreedom setup init

          test -f ~/.codefreedom/.env.user || { echo "MISSING: .env.user"; exit 1; }
          test -f ~/.codefreedom/proxy/config/config.yaml || { echo "MISSING: proxy config"; exit 1; }
          test -f ~/.codefreedom/proxy/docker-compose.yaml || { echo "MISSING: compose"; exit 1; }
          test -f ~/.codefreedom/profiles/chrome.yaml || { echo "MISSING: chrome profile"; exit 1; }
          test -f ~/.codefreedom/profiles/web.yaml || { echo "MISSING: web profile"; exit 1; }
          test -f ~/.codefreedom/profiles/github.yaml || { echo "MISSING: github profile"; exit 1; }
          test -f ~/.codefreedom/profiles/web-bridge.yaml || { echo "MISSING: web-bridge profile"; exit 1; }

          codefreedom run agent claude-code --list-profiles
