            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=camoufox-v${{ steps.version.outputs.version }}
            type=raw,value=camoufox-v${{ steps.version.outputs.major_minor }}
            type=raw,value=camoufox-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Camoufox Browser (MCP)
            org.opencontainers.image.description=Web automation with Camoufox (Firefox fork) + Xvfb + PyAutoGUI + MCP server
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=Camoufox

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/camoufox/
          file: docker/camoufox/Dockerfile.Camoufox
          platforms: linux/arm64,linux/amd64
          build-args: |
            CODEFREEDOM_VERSION=v${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=Camoufox
          cache-to: type=gha,mode=max,scope=Camoufox

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Summary ────────────────────────────────────────────────────────────
  summary:
    needs: [build-cuda, build-rocm, build-ubuntu, build-chrome, build-camoufox]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "📦 Version: v${VERSION}"

      - name: Print summary
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "### 🐳 Published CodeFreedom Images" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Platform | Tag |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|----------|-----|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| NVIDIA CUDA | \`cuda-v${V}\`, \`cuda-latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| AMD ROCm | \`rocm-v${V}\`, \`rocm-latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Ubuntu (general) | \`v${V}\`, \`latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Chrome (browser) | \`chrome-v${V}\`, \`chrome-latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Camoufox (MCP browser) | \`camoufox-v${V}\`, \`camoufox-latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "**Registries:** \`docker.io/nilayparikh/codefreedom\` · \`ghcr.io/nilayparikh/codefreedom\`" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "docker pull nilayparikh/codefreedom:chrome-v${V}" >> "${GITHUB_STEP_SUMMARY}"
          echo "docker pull nilayparikh/codefreedom:camoufox-v${V}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
