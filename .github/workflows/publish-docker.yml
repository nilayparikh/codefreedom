# ── CodeFreedom Docker Publish Workflow ────────────────────────────────────────
# Builds and publishes ALL multi-platform Docker images.
# Each image also has its own individual workflow (docker-{image}.yml)
# triggered only by changes to its specific Dockerfile.
#
# This workflow is for broad pushes, version tags, and manual "build all" dispatch.
#
# Tag scheme:
#   cuda-v0.1.0, cuda-latest         → NVIDIA GPUs (arm64 + amd64)
#   rocm-v0.1.0, rocm-latest         → AMD GPUs (amd64)
#   v0.1.0, latest                   → Common Ubuntu base (arm64 + amd64)
#   chrome-v0.1.0, chrome-latest     → Chrome browser (arm64 + amd64)
#   camoufox-v0.1.0, camoufox-latest → Camoufox browser (arm64 + amd64)
# ────────────────────────────────────────────────────────────────────────────────

name: Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  DOCKER_HUB_REPO: nilayparikh/codefreedom
  GHCR_REPO: ghcr.io/nilayparikh/codefreedom

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  # ── Build CUDA (NVIDIA GPUs) ───────────────────────────────────────────
  build-cuda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "📦 Version: v${VERSION}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=cuda-v${{ steps.version.outputs.version }}
            type=raw,value=cuda-v${{ steps.version.outputs.major_minor }}
            type=raw,value=cuda-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Claude Code (CUDA)
            org.opencontainers.image.description=NVIDIA CUDA — all NVIDIA GPUs (DGX GB200, H100, A100, L40S, RTX)
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=CUDA

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/claude-code/
          file: docker/claude-code/Dockerfile.CUDA
          platforms: linux/arm64,linux/amd64
          build-args: |
            CODEFREEDOM_VERSION=v${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=CUDA
          cache-to: type=gha,mode=max,scope=CUDA

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Build ROCm (AMD GPUs) ──────────────────────────────────────────────
  build-rocm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "📦 Version: v${VERSION}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=rocm-v${{ steps.version.outputs.version }}
            type=raw,value=rocm-v${{ steps.version.outputs.major_minor }}
            type=raw,value=rocm-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Claude Code (ROCm)
            org.opencontainers.image.description=AMD ROCm — Instinct MI300X, MI250X, Radeon PRO
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=ROCm

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/claude-code/
          file: docker/claude-code/Dockerfile.ROCm
          platforms: linux/amd64
          build-args: |
            CODEFREEDOM_VERSION=v${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=ROCm
          cache-to: type=gha,mode=max,scope=ROCm

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Build Ubuntu (general-purpose, no PyTorch) ──────────────────────────
  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "📦 Version: v${VERSION}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.major_minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Claude Code (Ubuntu)
            org.opencontainers.image.description=Ubuntu base — Claude Code + dev tools, no PyTorch
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            com.codefreedom.platform=Ubuntu

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/claude-code/
          file: docker/claude-code/Dockerfile.Ubuntu
          platforms: linux/arm64,linux/amd64
          build-args: |
            CODEFREEDOM_VERSION=v${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=Ubuntu
          cache-to: type=gha,mode=max,scope=Ubuntu

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Build Chrome (Browser) ─────────────────────────────────────────────
  build-chrome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "📦 Version: v${VERSION}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
