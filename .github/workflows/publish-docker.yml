# ── CodeFreedom Docker Publish Workflow ────────────────────────────────────────
# Builds and publishes multi-platform Docker images to:
#   • Docker Hub:    docker.io/nilayparikh/codefreedom
#   • GitHub CR:     ghcr.io/nilayparikh/codefreedom
#
# Triggered on: push to main, version tags (v*), or manual dispatch.
#
# Tag scheme:
#   CUDA-v0.1.0, CUDA-latest         → NVIDIA GPUs (arm64 + amd64)
#   ROCm-v0.1.0, ROCm-latest         → AMD GPUs (amd64)
#   v0.1.0, latest                   → Common Ubuntu base (arm64 + amd64)
# ────────────────────────────────────────────────────────────────────────────────

name: Publish Docker Images

on:
  workflow_dispatch:

env:
  DOCKER_HUB_REPO: nilayparikh/codefreedom
  GHCR_REPO: ghcr.io/nilayparikh/codefreedom

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  # ── Extract version from pyproject.toml ──────────────────────────────────
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "📦 Version: v${VERSION}"

  # ── Build CUDA (NVIDIA GPUs) ───────────────────────────────────────────
  build-cuda:
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=CUDA-v${{ needs.version.outputs.version }}
            type=raw,value=CUDA-v${{ needs.version.outputs.major_minor }}
            type=raw,value=CUDA-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Claude Code (CUDA)
            org.opencontainers.image.description=NVIDIA CUDA — all NVIDIA GPUs (DGX GB200, H100, A100, L40S, RTX)
            org.opencontainers.image.version=v${{ needs.version.outputs.version }}
            com.codefreedom.platform=CUDA

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/claude-code/
          file: docker/claude-code/Dockerfile.CUDA
          platforms: linux/arm64,linux/amd64
          build-args: |
            CODEFREEDOM_VERSION=v${{ needs.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=CUDA
          cache-to: type=gha,mode=max,scope=CUDA

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Build ROCm (AMD GPUs) ──────────────────────────────────────────────
  build-rocm:
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=ROCm-v${{ needs.version.outputs.version }}
            type=raw,value=ROCm-v${{ needs.version.outputs.major_minor }}
            type=raw,value=ROCm-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Claude Code (ROCm)
            org.opencontainers.image.description=AMD ROCm — Instinct MI300X, MI250X, Radeon PRO
            org.opencontainers.image.version=v${{ needs.version.outputs.version }}
            com.codefreedom.platform=ROCm

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/claude-code/
          file: docker/claude-code/Dockerfile.ROCm
          platforms: linux/amd64
          build-args: |
            CODEFREEDOM_VERSION=v${{ needs.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ROCm
          cache-to: type=gha,mode=max,scope=ROCm

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Build Ubuntu (general-purpose, no PyTorch) ──────────────────────────
  build-ubuntu:
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=v${{ needs.version.outputs.major_minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Claude Code (Ubuntu)
            org.opencontainers.image.description=Ubuntu base — Claude Code + dev tools, no PyTorch
            org.opencontainers.image.version=v${{ needs.version.outputs.version }}
            com.codefreedom.platform=Ubuntu

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/claude-code/
          file: docker/claude-code/Dockerfile.Ubuntu
          platforms: linux/arm64,linux/amd64
          build-args: |
            CODEFREEDOM_VERSION=v${{ needs.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=Ubuntu
          cache-to: type=gha,mode=max,scope=Ubuntu

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Build Chrome (Browser) ─────────────────────────────────────────────
  build-chrome:
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=Chrome-v${{ needs.version.outputs.version }}
            type=raw,value=Chrome-v${{ needs.version.outputs.major_minor }}
            type=raw,value=Chrome-latest
          labels: |
            org.opencontainers.image.title=CodeFreedom - Chrome Browser
            org.opencontainers.image.description=Chrome + Xvfb for undetectable headed browsing via CDP port 9222
            org.opencontainers.image.version=v${{ needs.version.outputs.version }}
            com.codefreedom.platform=Chrome

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/browser/
          file: docker/browser/Dockerfile.Chrome
          platforms: linux/arm64,linux/amd64
          build-args: |
            CODEFREEDOM_VERSION=v${{ needs.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=Chrome
          cache-to: type=gha,mode=max,scope=Chrome

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Summary ────────────────────────────────────────────────────────────
  summary:
    needs: [version, build-cuda, build-rocm, build-ubuntu, build-chrome]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Print summary
        run: |
          V="${{ needs.version.outputs.version }}"
          echo "### 🐳 Published CodeFreedom Images" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Platform | Tag |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|----------|-----|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| NVIDIA CUDA | \`CUDA-v${V}\`, \`CUDA-latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| AMD ROCm | \`ROCm-v${V}\`, \`ROCm-latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Ubuntu (general) | \`v${V}\`, \`latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Chrome (browser) | \`Chrome-v${V}\`, \`Chrome-latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "**Registries:** \`docker.io/nilayparikh/codefreedom\` · \`ghcr.io/nilayparikh/codefreedom\`" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "docker pull nilayparikh/codefreedom:Chrome-v${V}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
