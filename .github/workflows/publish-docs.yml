# ── CodeFreedom Docs: MkDocs → GitHub Pages ──────────────────────────────────
# Builds the MkDocs Material site and deploys to GitHub Pages.
#
# Base URL: https://nilayparikh.github.io/codefreedom/
# ────────────────────────────────────────────────────────────────────────────────

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "mkdocs.yml"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install 'mkdocs-material[imaging]==9.7.6' mkdocs-mermaid2-plugin

      - name: Lint Markdown
        run: npx markdownlint-cli2 "pages/**/*.md"

      - name: Build
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
