# ── CodeFreedom GitHub Pages Publish Workflow ─────────────────────────────────
# Converts /docs/*.md to HTML via Jekyll and publishes to GitHub Pages.
#
# Triggered on: push to main (when docs/ change), or manual dispatch.
#
# Base URL: https://nilayparikh.github.io/codefreedom/
#   /              → docs/index.md
#   /proxy         → docs/proxy.md
#   /claude-code   → docs/claude-code.md
# ────────────────────────────────────────────────────────────────────────────────

name: Publish Docs (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare pages artifact
        run: |
          rm -rf _site
          mkdir -p _site

          # Copy docs as-is (Jekyll renders .md → .html)
          # docs/index.md → index.html (landing page)
          cp -r docs/* _site/

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: _site/
          destination: _site/_output

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/_output/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
