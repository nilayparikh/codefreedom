# ── CodeFreedom Publish RC Workflow ────────────────────────────────────────────
# Publishes release candidate version to PyPI from release/v* branches.
#
# Trigger: manual dispatch only (100% user-controlled).
# Branch: release/v* only.
# Version: derived from version.yaml at runtime.
#
# Uses PyPI Trusted Publishing (OIDC) — no API tokens needed.
# ──────────────────────────────────────────────────────────────────────────────

name: Publish RC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate branch
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: resolve
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          if [[ "$BRANCH" != release/v* ]]; then
            echo "Error: must be on release/v* branch. Current: $BRANCH"
            exit 1
          fi

          VERSION=$(grep '^version: ' version.yaml | head -1 | sed 's/version: "\(.*\)"/\1/')
          RC=$(grep '^rc: ' version.yaml | head -1 | sed 's/rc: //')
          FULL_VERSION="${VERSION}rc${RC}"
          echo "version=${FULL_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Branch: $BRANCH → Version: ${FULL_VERSION}"

  test:
    name: "Test on ${{ matrix.os }} / py${{ matrix.python-version }}"
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest tests/ -v

  build:
    name: Build distribution
    needs: [validate, test]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Override version in pyproject.toml
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "Version overridden to ${VERSION}"
          grep '^version' pyproject.toml

      - name: Build package
        run: python -m build

      - name: Verify artifacts
        run: |
          ls -la dist/
          test -f dist/codefreedom-*.tar.gz || { echo "MISSING: sdist"; exit 1; }
          test -f dist/codefreedom-*.whl   || { echo "MISSING: wheel"; exit 1; }
          echo "Artifacts built successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/codefreedom/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
