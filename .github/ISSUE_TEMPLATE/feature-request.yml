name: Feature Request
description: Suggest an idea for CodeFreedom
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of CodeFreedom does this affect?
      options:
        - codefreedom run agent claude-code (Claude Code launcher)
        - codefreedom run proxy (LiteLLM proxy)
        - codefreedom --init (initialization)
        - Documentation
        - CI/CD / Build
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here
