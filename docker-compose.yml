---
# ── CodeFreedom Root Docker Compose ───────────────────────────────────────────
# Starts the LiteLLM proxy. Claude Code runs via the CLI, not via compose.
#
# This is intentionally minimal — codefreedom is a CLI-first tool.
# The LiteLLM proxy is the only service managed by docker compose.
# Claude Code runs through the `codefreedom claude` or `cf cc` CLI.
#
# For the full stack (PostgreSQL, llama.cpp, observability), use .init.
# ──────────────────────────────────────────────────────────────────────────────

include:
  - ./litellm/docker-compose.litellm.yml

name: codefreedom
