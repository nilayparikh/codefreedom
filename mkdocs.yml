# ── MkDocs Configuration for CodeFreedom ─────────────────────────────────────
site_name: CodeFreedom
site_description: "Single wrapper for all code agents — simple LLM routing and profile management"
site_url: https://nilayparikh.github.io/codefreedom/
repo_url: https://github.com/nilayparikh/codefreedom
edit_uri: edit/main/pages/
docs_dir: pages

theme:
      name: material
      logo: assets/logo.svg
      favicon: assets/logo.svg
      custom_dir: pages/overrides
      features:
            - navigation.tabs
            - navigation.tabs.sticky
            - navigation.instant
            - navigation.tracking
            - navigation.sections
            - navigation.path
            - navigation.top
            - toc.follow
            - search.suggest
            - search.highlight
            - search.share
            - content.code.copy
            - content.code.annotate
            - content.tabs.link
            - content.tooltips
            - content.action.edit
      icon:
            repo: fontawesome/brands/github
      font:
            text: Space Grotesk
            code: JetBrains Mono
      palette:
            - media: "(prefers-color-scheme)"
              toggle:
                    icon: material/brightness-auto
                    name: Switch to light mode
            - media: "(prefers-color-scheme: light)"
              scheme: default
              primary: teal
              accent: light blue
              toggle:
                    icon: material/brightness-7
                    name: Switch to dark mode
            - media: "(prefers-color-scheme: dark)"
              scheme: slate
              primary: teal
              accent: light blue
              toggle:
                    icon: material/brightness-4
                    name: Switch to system preference

copyright: >
      &copy; 2025-2026 Nilay Parikh.
      Apache 2.0.
      Trademarks are property of their respective owners.
      See <a href="https://github.com/nilayparikh/codefreedom/blob/main/NOTICE">NOTICE</a>.

plugins:
      - search
      - mermaid2

markdown_extensions:
      - admonition
      - attr_list
      - md_in_html
      - pymdownx.details
      - pymdownx.superfences:
              custom_fences:
                    - name: mermaid
                      class: mermaid
                      format: !!python/name:mermaid2.fence_mermaid_custom
      - pymdownx.tabbed:
              alternate_style: true
      - pymdownx.highlight:
              anchor_linenums: true
              line_spans: __span
              pygments_lang_class: true
      - pymdownx.inlinehilite
      - pymdownx.keys
      - pymdownx.snippets
      - pymdownx.tasklist:
              custom_checkbox: true
      - pymdownx.smartsymbols
      - pymdownx.caret
      - pymdownx.mark
      - pymdownx.tilde
      - pymdownx.emoji:
              emoji_index: !!python/name:material.extensions.emoji.twemoji
              emoji_generator: !!python/name:material.extensions.emoji.to_svg
      - toc:
              permalink: true
              toc_depth: 3

nav:
      - Home: index.md
      - Get Started: getting-started/index.md
      - Agents:
              - Overview: agents/index.md
              - Claude Code: agents/claude-code.md
              - MiMo Code: agents/mimo-code.md
              - OpenCode: agents/open-code.md
              - Pi Code: agents/pi-code.md
              - Codex: agents/codex-code.md
      - Recipes:
              - Overview: recipes/index.md
              - costeffective-coding: recipes/costeffective-coding.md
              - costeffective-coding-with-local: recipes/costeffective-coding-with-local.md
      - Tools:
              - Overview: tools/index.md
              - Chrome: tools/chrome.md
              - Web: tools/web.md
              - GitHub: tools/github.md
              - Web Bridge: tools/web-bridge.md
              - Codebase Memory: tools/codebase-memory.md
      - Legal:
              - License: license.md
              - Terms: terms.md
              - Privacy: privacy.md

extra:
      generator: false
      social:
            - icon: fontawesome/brands/youtube
              link: https://www.youtube.com/@localm_tuts
              name: YouTube
            - icon: fontawesome/brands/x-twitter
              link: https://x.com/localm_tuts
              name: X
            - icon: fontawesome/brands/linkedin
              link: https://www.linkedin.com/in/niparikh/
              name: LinkedIn

extra_css:
      - stylesheets/extra.css

extra_javascript:
      - js/external-links.js
