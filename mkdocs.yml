# ── MkDocs Configuration for CodeFreedom ─────────────────────────────────────
site_name: CodeFreedom
site_description: "Single wrapper for all code agents — simple LLM routing, sandboxing, and profile management"
site_url: https://nilayparikh.github.io/codefreedom/
repo_url: https://github.com/nilayparikh/codefreedom
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

copyright: >
  &copy; 2025-2026 Nilay Parikh.
  Apache 2.0.
  Trademarks are property of their respective owners.
  See <a href="https://github.com/nilayparikh/codefreedom/blob/main/NOTICE">NOTICE</a>.

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

