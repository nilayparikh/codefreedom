              - Nemotron-3-Super-FREE: proxy/providers/opencode-zen/nemotron-3-super.md
              - Nemotron-3-Ultra-FREE: proxy/providers/opencode-zen/nemotron-3-ultra.md
              - DeepSeek-V4-Flash-FREE: proxy/providers/opencode-zen/deepseek-v4-flash.md
