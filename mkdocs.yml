# ── MkDocs Configuration for CodeFreedom ─────────────────────────────────────
site_name: CodeFreedom
site_description: "Single wrapper for all code agents — simple LLM routing, sandboxing, and profile management"
site_url: https://nilayparikh.github.io/codefreedom/
repo_url: https://github.com/nilayparikh/codefreedom
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nilayparikh/codefreedom
      name: CodeFreedom on GitHub
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

copyright: >
  &copy; 2025-2026 Nilay Parikh.
  Apache 2.0.
  Trademarks are property of their respective owners.
  See <a href="https://github.com/nilayparikh/codefreedom/blob/main/NOTICE">NOTICE</a>.

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      # Route ```mermaid``` blocks to the mermaid2 plugin via its
      # Material-theme formatter. Without this, pymdownx.highlight strips the
      # language class from the <code> element and the mermaid2 plugin's
      # `on_post_page` cannot locate the diagrams — they render as plain code.
      # See: https://github.com/fralau/mkdocs-mermaid2-plugin
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

