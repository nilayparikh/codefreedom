<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <g transform="translate(256, 260) scale(1.75)">
    <!-- Underlying Glow -->
    <path d="M -120, -40 L -70, 0 L -120, 40" fill="none" stroke="#6366F1" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#glow)" />

    <!-- Left Bracket -->
    <path d="M -110, -55 L -45, 0 L -110, 55" fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Bracket (curved outward) -->
    <path d="M 45, -65 C 85, -40 120, 0 120, 65" fill="none" stroke="url(#secondaryGrad)" stroke-width="26" stroke-linecap="round" />

    <!-- Terminal Cursor -->
    <rect x="-12" y="40" width="52" height="16" rx="8" fill="#F8FAFC" />

    <!-- Bridge Node -->
    <circle cx="22" cy="-22" r="18" fill="#34D399" />
  </g>
</svg>
